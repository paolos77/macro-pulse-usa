name: Aggiorna dashboard macro

on:
  schedule:
    - cron: "15 6 * * 1"   # ogni lunedi' 06:15 UTC (08:15 ora italiana legale)
  workflow_dispatch: {}     # pulsante "Run workflow" per aggiornare a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test logica
        run: pip install pytest && pytest -q tests
      - name: Scarica dati e genera la pagina
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python macro_dashboard.py
      - name: Salva il risultato
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Aggiornamento settimanale $(date -u +%F)"
          git push
